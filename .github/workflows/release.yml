name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Version Packages PR + tags
  pull-requests: write
  id-token: write # OIDC: npm Trusted Publishing + provenance (no token needed)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # Opens/updates a "Version Packages" PR when changesets are present;
      # when that PR is merged (no changesets left), runs `ci:publish`, which
      # publishes via `pnpm publish` using OIDC (no NPM_TOKEN). Each package must
      # have a Trusted Publisher configured on npmjs.com pointing at this repo +
      # workflow (Settings → Publishing access → Trusted Publisher).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm run version` (not `pnpm version`, which is pnpm's built-in).
          version: pnpm run version
          publish: pnpm ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
